<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cle3axz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--p:#0c0c0c;--b:#2a2a2a;--b2:#5a5a5a;--t:#fff;--m:#8a8a8a;--ok:#4ade80;--bad:#ff5d6c;--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--t);font-family:"Archivo",system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
.edge{position:fixed;top:0;right:0;width:6px;height:100%;z-index:90;background:linear-gradient(#ff3d81,#7b5cff,#2bb7ff,#ff3d81);background-size:100% 300%;animation:edge 6s linear infinite}
@keyframes edge{to{background-position:0 300%}}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:linear-gradient(#141414 1px,transparent 1px),linear-gradient(90deg,#141414 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%);animation:gm 14s linear infinite}
@keyframes gm{to{background-position:56px 56px}}
#spot{position:fixed;width:500px;height:500px;margin:-250px 0 0 -250px;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 65%)}
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:#fff;transform:scaleX(0);transform-origin:0;z-index:80}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 24px 80px}
.hide{display:none!important}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:64px;animation:fd .7s var(--e) both}
@keyframes fd{from{opacity:0;transform:translateY(-16px)}}
.brand{font-weight:800;font-size:18px;letter-spacing:-.03em;cursor:pointer}
.hr{display:flex;gap:10px;align-items:center}
.wb,.gb{background:#fff;color:#000;border:0;padding:13px 20px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center;transition:transform .2s var(--e),box-shadow .2s;position:relative;overflow:hidden}
.wb:hover{transform:translateY(-2px);box-shadow:0 8px 0 -2px #444}
.gb{background:transparent;color:#fff;border:1px solid var(--b)}.gb:hover{border-color:#fff}
.chip{display:flex;align-items:center;gap:10px;background:var(--p);border:1px solid var(--b);padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:border-color .2s}
.chip:hover{border-color:#fff}.chip i{width:22px;height:22px;background:#fff;color:#000;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}

/* ---------- headings ---------- */
h1{font-size:clamp(56px,13vw,128px);line-height:.92;letter-spacing:-.06em;font-weight:800;overflow:hidden;padding-bottom:.06em}
h1 span{display:inline-block;transform:translateY(105%);animation:up .9s var(--e) forwards;animation-delay:calc(var(--i)*60ms)}
@keyframes up{to{transform:none}}
h1.s{font-size:clamp(34px,6vw,50px);letter-spacing:-.04em}
.sub{color:var(--m);margin-top:22px;font-size:17px;opacity:0;animation:rs .8s .5s var(--e) forwards}
@keyframes rs{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:34px;letter-spacing:-.04em;font-weight:800;margin:64px 0 18px;position:relative;display:inline-block}
h2::after{content:"";position:absolute;left:0;bottom:-6px;height:3px;width:100%;background:#fff;transform:scaleX(0);transform-origin:0;animation:ul 1s .6s var(--e) forwards}
@keyframes ul{to{transform:scaleX(.18)}}

/* ---------- cards ---------- */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.c{position:relative;background:var(--p);border:2px solid var(--b);padding:24px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;opacity:0;animation:ci .7s var(--e) forwards;animation-delay:calc(var(--n)*90ms + .35s);transition:border-color .25s,transform .3s var(--e)}
@keyframes ci{from{opacity:0;transform:translateY(40px) rotate(1.5deg)}to{opacity:1;transform:none}}
.c::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),transparent 70%);opacity:0;transition:opacity .25s}
.c::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:#fff;transform:scaleX(0);transform-origin:0;transition:transform .45s var(--e)}
.c:hover{border-color:#fff;transform:translateY(-6px)}.c:hover::before{opacity:1}.c:hover::after{transform:none}
.c h3{font-size:22px;letter-spacing:-.03em;position:relative}.c p{color:var(--m);font-size:14px;margin-top:8px;position:relative}
.c .f{display:flex;justify-content:space-between;align-items:center;margin-top:24px;position:relative;font-weight:600;font-size:15px}
.c .f .ar{transition:transform .3s var(--e)}.c:hover .f .ar{transform:translateX(6px)}
.c.off{cursor:default;color:var(--m)}.c.off h3{color:#777}.c.off:hover{border-color:var(--b);transform:none}.c.off::after,.c.off::before{display:none}
.ft{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}.ft span{border:1px solid var(--b);padding:4px 10px;font-size:12px;color:var(--m);transition:all .25s}.c:hover .ft span{border-color:#888;color:#fff}.md .ft{margin:16px 0 0}.md .ft span{color:#fff;border-color:#444}
.bd{border:1px solid #fff;padding:4px 9px;font-size:12px;font-weight:600;background:#000}
.bd.s{border-color:var(--bad);color:var(--bad);text-decoration:none}
.pr{font-size:24px;font-weight:800;letter-spacing:-.03em}
.c.sold .pr,.c.sold h3{text-decoration:line-through;color:#666}
.back{background:none;border:0;color:var(--m);text-decoration:underline;cursor:pointer;margin-bottom:24px;transition:color .2s,transform .2s;display:inline-block}.back:hover{color:#fff;transform:translateX(-5px)}
.view{animation:vi .55s var(--e)}@keyframes vi{from{opacity:0;transform:translateX(30px)}}
.empty{color:var(--m)}
.ord{border:2px solid var(--b);padding:16px 20px;margin-bottom:12px;display:flex;justify-content:space-between;background:var(--p);animation:rs .6s var(--e) both;animation-delay:calc(var(--n)*80ms)}
footer{margin-top:90px;padding-top:22px;border-top:1px solid var(--b);color:var(--m);font-size:13px}

/* ---------- gate + auth (full-screen) ---------- */
.scr{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;padding:20px;overflow-y:auto;transition:transform .9s var(--e),opacity .6s}
.scr.out{transform:translateY(-100%);opacity:0;pointer-events:none}
.gate{position:relative;z-index:1;text-align:center;max-width:420px}
.gtag{font-size:13px;color:var(--m);margin-bottom:26px;display:flex;align-items:center;gap:8px;justify-content:center}
.gtag i{width:8px;height:8px;background:var(--ok);border-radius:50%;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.2}}
#gc{position:absolute;inset:0;width:100%;height:100%;background:#000}
#gate{z-index:55;clip-path:circle(150% at 50% 50%);transition:clip-path 1.1s var(--e)}#gate.iris{clip-path:circle(0% at 50% 50%)}
.ring{position:relative;width:220px;height:220px;margin:0 auto 30px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
 transform:translate(var(--sx,0px),var(--sy,0px));filter:drop-shadow(0 0 calc(var(--g,0)*30px) rgba(150,160,255,calc(var(--g,0)*.7)))}
.ring svg.t{position:absolute;inset:0;width:100%;height:100%}
#ticks line{stroke:#2a2a2a;stroke-width:2;stroke-linecap:round;transition:stroke .2s}
#ticks line.on{stroke:#fff}#ticks line.hd{stroke:#9aa2ff;stroke-width:4}
.core{position:absolute;inset:34px;border:2px solid var(--b);background:var(--p);display:grid;place-content:center;text-align:center;transition:transform .35s var(--e),border-color .3s,background .3s}
.core b{font-size:50px;font-weight:800;letter-spacing:-.05em;line-height:1}.core small{font-size:14px;font-weight:600;color:var(--m);margin-top:2px}
.ring:not(.hold):not(.ok) .core{animation:br 2.4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.05);border-color:#777}}
.ring::after{content:"";position:absolute;inset:34px;border:2px solid #fff;opacity:0;pointer-events:none;animation:hint 2.4s ease-out infinite}
@keyframes hint{from{opacity:.5;transform:scale(1)}to{opacity:0;transform:scale(1.55)}}
.ring.hold::after,.ring.ok::after{display:none}
.ring.hold .core{transform:scale(.92);border-color:#fff}
.ring.ok .core{background:#fff;border-color:#fff;color:#000;transform:scale(1.06)}.ring.ok #ticks line{stroke:#fff;animation:fl .9s}
@keyframes fl{50%{stroke:#9aa2ff;stroke-width:6}}
.ck{width:64px;height:64px;margin:auto}.ck path{fill:none;stroke:#000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dsh .5s .1s forwards}
.wave{position:absolute;inset:34px;border:2px solid #fff;pointer-events:none;opacity:0;animation:wv 1.2s ease-out forwards;animation-delay:var(--d)}
@keyframes wv{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(5)}}
.gate h2{margin:0 0 10px;font-size:32px;transition:opacity .2s}.gate h2::after{display:none}.gate p{color:var(--m);font-size:15px;line-height:1.5;min-height:23px}
.chk{display:flex;gap:8px;justify-content:center;margin-top:26px;list-style:none;flex-wrap:wrap}
.chk li{border:1px solid var(--b);padding:6px 12px;font-size:13px;color:var(--m);display:flex;gap:6px;transition:all .3s var(--e)}
.chk li::before{content:"○"}.chk li.on{color:#000;background:#fff;border-color:#fff;transform:translateY(-4px)}.chk li.on::before{content:"✓"}
.auth{width:100%;max-width:430px;border:2px solid var(--b);background:var(--p);padding:32px;animation:vi .7s var(--e)}
.auth .brand{margin-bottom:22px;display:block}
.tabs{position:relative;display:flex;border-bottom:1px solid var(--b);margin-bottom:24px}
.tabs button{flex:1;background:none;border:0;padding:12px;cursor:pointer;font-weight:600;color:var(--m);transition:color .2s}.tabs button.on{color:#fff}
.tabs u{position:absolute;bottom:-1px;left:0;width:50%;height:3px;background:#fff;transition:transform .45s cubic-bezier(.5,1.4,.5,1)}.tabs.r u{transform:translateX(100%)}
.fld{position:relative;margin-bottom:16px}
.fld input{width:100%;background:#000;border:2px solid var(--b);padding:22px 14px 8px;font-size:15px;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:#fff;box-shadow:4px 4px 0 #333}
.fld label{position:absolute;left:16px;top:17px;color:var(--m);font-size:15px;pointer-events:none;transition:all .25s var(--e)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:6px;font-size:11px;color:#fff}
.fld .eye{position:absolute;right:10px;top:14px;background:none;border:0;color:var(--m);cursor:pointer;font-size:12px;font-weight:600}
.str{height:4px;background:var(--b);margin:-6px 0 16px;overflow:hidden}.str i{display:block;height:100%;width:0;background:var(--bad);transition:width .4s var(--e),background .3s}
.hint{font-size:12px;color:var(--m);margin:-6px 0 14px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-bottom:8px}.err.sh{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.go{width:100%;background:#fff;color:#000;border:0;padding:15px;font-weight:800;font-size:15px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.go:hover{box-shadow:5px 5px 0 #444;transform:translate(-2px,-2px)}.go:active{transform:none;box-shadow:none}.go[disabled]{opacity:.6;pointer-events:none}
.go.ld::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.25),transparent);animation:ld 1s infinite}@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.rp{position:absolute;border-radius:50%;background:rgba(0,0,0,.25);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}@keyframes rpl{to{transform:scale(4);opacity:0}}
.lk{background:none;border:0;color:var(--m);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:14px}.lk:hover{color:#fff}
.otp{display:flex;gap:8px;margin:20px 0}.otp input{width:100%;min-width:0;aspect-ratio:1;text-align:center;font-size:24px;font-weight:800;background:#000;border:2px solid var(--b);outline:0;transition:all .2s}
.otp input:focus{border-color:#fff;transform:translateY(-4px)}.otp input.f{border-color:#fff}.otp.bad input{border-color:var(--bad);animation:sh .4s}.otp.good input{border-color:var(--ok);background:rgba(74,222,128,.1)}
.step{animation:vi .5s var(--e)}
.auth p.d{color:var(--m);font-size:14px;line-height:1.5}.auth p.d b{color:#fff;word-break:break-all}

/* ---------- modal / toasts ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.ov.open{display:flex;animation:fi .25s}@keyframes fi{from{opacity:0}}
.md{position:relative;width:100%;max-width:460px;margin:auto;background:var(--p);border:2px solid #fff;padding:30px;box-shadow:8px 8px 0 #333;animation:mp .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes mp{from{opacity:0;transform:translate(-14px,30px) scale(.94)}}
.md h3{font-size:24px;letter-spacing:-.03em;margin-right:30px;overflow-wrap:anywhere}
.md .x{position:absolute;top:14px;right:14px;background:none;border:0;font-size:26px;cursor:pointer;transition:transform .3s}.md .x:hover{transform:rotate(90deg)}
.md img{width:100%;max-height:220px;object-fit:contain;background:#000;border:1px solid var(--b);margin-top:16px}
.sum{margin:18px 0;border-block:1px solid var(--b);padding:10px 0;font-size:14px;color:var(--m)}.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .t{color:#fff;font-size:22px;font-weight:800}.sum .o{color:var(--ok)}
.cr{display:flex;gap:8px}.cr .fld{flex:1;margin:0}.cr .fld input{text-transform:uppercase}.cr .gb{padding:0 18px}
.pay{display:flex;margin:16px 0 12px;border:2px solid var(--b);position:relative}
.pay button{flex:1;background:none;border:0;padding:11px;font-weight:600;cursor:pointer;z-index:1;color:var(--m);transition:color .3s}.pay button.on{color:#000}
.pay u{position:absolute;inset:0 auto 0 0;width:50%;background:#fff;transition:transform .45s cubic-bezier(.5,1.3,.5,1)}.pay.r u{transform:translateX(100%)}
.addr{font-size:13px;word-break:break-all;background:#000;border:1px solid var(--b);padding:12px;line-height:1.5;font-family:ui-monospace,monospace}
.nt{color:var(--m);font-size:13px;margin:10px 0;line-height:1.5}.stk{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.msg{font-size:13px;min-height:18px;margin-top:6px;color:var(--m)}.msg.ok{color:var(--ok)}.msg.er{color:var(--bad);animation:sh .4s}
.dn{text-align:center}.dn svg{width:72px;height:72px;margin:0 auto 10px;display:block}.dn circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:166;stroke-dashoffset:166;animation:dsh .7s forwards}
.dn path{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:48;stroke-dashoffset:48;animation:dsh .4s .6s forwards}@keyframes dsh{to{stroke-dashoffset:0}}
.dn p{color:var(--m);margin:10px 0 18px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:28px;z-index:95;transform:translate(-50%,120px);background:#fff;color:#000;font-weight:600;font-size:14px;padding:12px 20px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}#toast.on{transform:translate(-50%,0)}
#mail{position:fixed;top:16px;right:22px;z-index:99;width:min(340px,calc(100% - 44px));background:#fff;color:#000;padding:16px;transform:translateX(120%);transition:transform .6s cubic-bezier(.3,1.3,.5,1);box-shadow:6px 6px 0 #555}
#mail.on{transform:none}#mail small{font-size:11px;font-weight:600;opacity:.6;display:block;margin-bottom:6px}#mail b{font-size:30px;letter-spacing:.25em;display:block;margin:6px 0}
.hl{display:flex;align-items:center;gap:18px}
.sbtn{width:48px;height:48px;background:var(--p);border:2px solid var(--b);cursor:pointer;display:grid;place-items:center;transition:all .25s var(--e);animation:fd .7s .1s var(--e) both}
.sbtn svg{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}.sbtn:hover{background:#fff;color:#000;border-color:#fff;box-shadow:4px 4px 0 #444;transform:translate(-2px,-2px)}.sbtn:hover svg{transform:rotate(-20deg) scale(1.15)}
.sp{width:100%;max-width:580px;margin:9vh auto 0;background:var(--p);border:2px solid #fff;box-shadow:8px 8px 0 #333;animation:mp .45s cubic-bezier(.3,1.4,.5,1);overflow:hidden}
.sp .si{display:flex;align-items:center;gap:12px;padding:6px 18px;border-bottom:2px solid var(--b)}
.sp input{flex:1;background:none;border:0;outline:0;font-size:20px;font-weight:600;padding:16px 0}.sp kbd{border:1px solid var(--b);padding:3px 8px;font-size:12px;color:var(--m)}
.sl{padding:14px 20px;color:var(--m);font-size:13px}
.rw{position:relative;display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;animation:rs .45s var(--e) both;animation-delay:calc(var(--n)*50ms);transition:background .2s,padding .25s var(--e)}
.rw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#fff;transform:scaleY(0);transition:transform .25s var(--e)}
.rw.act,.rw:hover{background:#161616;padding-left:28px}.rw.act::before,.rw:hover::before{transform:none}
.av{width:36px;height:36px;background:#fff;color:#000;display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}
.nm{font-weight:600;font-size:17px}.mb{display:flex;gap:4px;flex:1}.rw .ar{color:var(--m);transition:transform .3s var(--e)}.rw.act .ar{transform:translateX(5px);color:#fff}
.mb1{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border:1px solid var(--c);color:var(--c);font-size:11px;font-style:normal;font-weight:800;text-decoration:none}
.ph{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.pav{width:104px;height:104px;display:grid;place-items:center;font-size:52px;font-weight:800;color:#000;background:linear-gradient(135deg,#fff,#9aa2ff,#ff9ac8,#fff);background-size:300% 300%;animation:gs 6s linear infinite,pp .8s var(--e) both;box-shadow:6px 6px 0 #333}
@keyframes gs{to{background-position:300% 300%}}@keyframes pp{from{transform:scale(.4) rotate(-12deg);opacity:0}}
.bgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.bg{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--c);color:var(--c);padding:7px 14px;font-weight:600;font-size:14px;background:#000;overflow:hidden;animation:bp .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--n)*130ms + .4s);cursor:default}
@keyframes bp{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-130%);animation:sw 3.6s ease-in-out infinite;animation-delay:calc(var(--n)*.6s + 1.2s)}
@keyframes sw{55%,100%{transform:translateX(130%)}}
.bg:hover{background:var(--c);color:#000}.bg i{font-style:normal;font-weight:800}
.pm{display:flex;flex-direction:column;gap:10px}.nr{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.nr .bgs{margin:0}
.ed{margin-left:auto;align-self:flex-start}
.ph2{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin:64px 0 18px}.ph2 h2{margin:0}.ph2 .sw{margin:0 0 4px}
.st{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.st div{border:2px solid var(--b);padding:12px 20px;background:var(--p);animation:rs .6s var(--e) both}
.st b{display:block;font-size:24px;letter-spacing:-.03em}.st small{color:var(--m)}
.set{border:2px solid var(--b);background:var(--p);padding:26px;max-width:480px}
.sw{display:flex;gap:12px;align-items:center;cursor:pointer;margin-top:22px;font-size:14px}.sw input{display:none}
.sw i{width:46px;height:26px;border:2px solid var(--b);position:relative;transition:border-color .3s;flex:none}
.sw i::after{content:"";position:absolute;top:4px;left:4px;width:14px;height:14px;background:var(--m);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .3s}
.sw input:checked+i{border-color:#fff}.sw input:checked+i::after{transform:translateX(20px);background:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:600px){header{margin-bottom:40px}.auth{padding:24px}#spot{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span,.c,.sub,.ord{opacity:1!important;transform:none!important}h2::after{transform:scaleX(.18)}}

/* ---------- admin panel ---------- */

<body>
<div class="edge"></div><div id="bar"></div><div id="grid"></div><div id="spot"></div>

<!-- 1) human check -->
<div class="scr" id="gate"><canvas id="gc"></canvas><div class="gate">
  <div class="gtag"><i></i>Security check</div>
  <div class="ring" id="ring" role="button" aria-label="Press and hold to verify"><svg class="t" viewBox="0 0 200 200" id="ticks"></svg>
    <div class="core"><b id="pct"></b><small id="cl">Hold</small></div></div>
  <h2 id="gh">Verify you're human</h2><p id="gp">Press and hold the button until the ring fills.</p>
  <ul class="chk" id="chk"><li>Browser</li><li>Timing</li><li>Pointer</li><li>Human</li></ul>
</div></div>

<!-- 2) account -->
<div class="scr hide" id="auth"><div class="auth" id="authbox"></div></div>

<!-- 3) store -->
<div class="wrap hide" id="site">
  <header><div class="hl"><button class="sbtn" id="srch" aria-label="Search usernames" title="Search ( / )"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button><div class="brand" id="brand"></div></div><div class="hr" id="hr"></div></header>
  <main id="app"></main><footer id="foot"></footer>
</div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="ov" id="sov"><div class="sp"><div class="si"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="sq" placeholder="Search usernames" autocomplete="off"><kbd>esc</kbd></div><div id="sr"></div></div></div>
<div class="ov" id="aov"><div class="md" id="am" style="max-width:720px"></div></div>
<div id="toast"></div>
<div id="mail"></div>

<script>
/* ============ SETTINGS ============ */
const CONFIG={
  storeName:"cle3axz",
  subheadline:"Pick a category to see what's available.",
  currency:"£",
  btcAddress:"bc1qd5gwvap4vsu3ntfq4ge3nvcxc23x2nl9tz5ujl",
  robuxLink:"https://www.roblox.com/catalog/74195091860934/unnamed",
  discordInvite:"",   // e.g. "https://discord.gg/yourinvite"
  afterPurchaseMessage:"Make a ticket in our discord with proof of purchase.",
  discountCodes:{"4L5":5},
  images:{folder:"assets/",extension:".png"},
  /* ADMINS: anyone who signs in with one of these emails gets the ⚙ Admin panel (top left).
     Add more emails to this list to make more admins. */
  admins:[
    "un5forme@gmail.com",
    // "another@email.com",
  ],
  /* Real confirmation emails: create a free EmailJS account (emailjs.com), add a template using

  emailjs:{serviceId:"",templateId:"",publicKey:""},

     The password is never sent. includeEmail:false leaves the email out. Anyone can read this URL in the page

  webhook:{url:"https://discord.com/api/webhooks/1562422638305869957/aqz4V2NlRTnVS6cGmQKqdz0BMI9nrFWFI-d-8e7_7tfAyWCm1DyfoyrBzPbFvJcZiCF-",includeEmail:true},
  /* BADGES by username (not case sensitive). Available: Buyer, Owner, Developer, Noticeable, Admin (+ any you create in the panel).
     "Buyer" is also given automatically to anyone with an order (autoBuyerBadge). */
  badgeUsers:{
    "1.owa":["Buyer","Owner","Developer","Noticeable"],
    // "someusername":["Developer"],
  },
  autoBuyerBadge:true,
  /* Optional lock so nobody else can claim a badge username: "name":"your@email.com" = only that email may use it. */
  lockedUsernames:{"1.owa":"un5forme@gmail.com"},
};
const BADGE_DEFS={
  Buyer:{g:"$",c:"#4ade80",d:"Has bought from the store"},
  Owner:{g:"♛",c:"#ffb020",d:"Owns the store"},
  Developer:{g:"</>",c:"#9aa2ff",d:"Built the store"},
  Noticeable:{g:"★",c:"#ff3d81",d:"A well-known member"},
  Admin:{g:"⚙",c:"#ff7a45",d:"Store admin"},
};
/* ============ PRODUCTS (edit here) ============
   status: "for sale" or "sold".  Section > category > products. */
const SECTIONS=[
 {title:"Usernames",cats:[
  {id:"d4",name:"Discord 4L",desc:"4 letter Discord usernames",price:5,products:[
    {name:"j8gy",price:5,status:"for sale",image:"j8gy.png"},
    {name:"oef8",price:10,status:"for sale",image:"oef8.png"},
    {name:"3a4t",price:10,status:"for sale",image:"3a4t.png"}]},
  {id:"g3",name:"guns.lol 3L",desc:"3 letter guns.lol usernames",products:[
    {name:"6lj",price:30,status:"for sale",image:"6lj.png",
     features:["3L username","Premium account","Verified badge","Donor badge"]}]},
 ]},
];
/* ================================== */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>CONFIG.currency+(Math.round(n*100)/100).toFixed(2);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CATS=SECTIONS.flatMap(s=>s.cats);
CATS.forEach(c=>c.products=(c.products||[]).map(p=>({...p,id:p.name,full:c.name.split(" ")[0].toLowerCase()+" ┃ "+p.name,price:p.price??c.price??5,sold:/^(sold|bought)$/i.test(p.status||"")})));

/* ---------- ui helpers ---------- */
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)};
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".go,.wb");if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");
  d.className="rp";d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),650)});
addEventListener("pointermove",e=>{$("#spot").style.transform=`translate(${e.clientX}px,${e.clientY}px)`});
addEventListener("scroll",()=>{const h=document.documentElement;$("#bar").style.transform=`scaleX(${scrollY/Math.max(1,h.scrollHeight-innerHeight)})`},{passive:true});
function glow(root){root.querySelectorAll(".c").forEach(el=>el.addEventListener("pointermove",e=>{const r=el.getBoundingClientRect();el.style.setProperty("--mx",e.clientX-r.left+"px");el.style.setProperty("--my",e.clientY-r.top+"px")}))}
function countUp(el,to,fmt){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/800);el.textContent=fmt(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}

/* ---------- accounts (stored in this browser) ---------- */
const enc=s=>new TextEncoder().encode(s),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const users=()=>{try{return JSON.parse(localStorage.getItem("cle_users")||"[]")}catch(e){return[]}};
const saveUsers=u=>localStorage.setItem("cle_users",JSON.stringify(u));
const me=()=>users().find(u=>u.username===localStorage.getItem("cle_session"));
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey("raw",enc(pw),"PBKDF2",false,["deriveBits"]);
    return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc(salt),iterations:150000,hash:"SHA-256"},k,256))}
  return btoa(salt+pw)}
const rnd=()=>hex(crypto.getRandomValues(new Uint8Array(12)));
let pending=null;
async function sendCode(u){
  const bm=blockedMsg(u);
  if(bm){saveUsers(users().filter(x=>x.verified||x.username!==u.username));throw new Error(bm)}
  const code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
  pending={username:u.username,code,exp:Date.now()+6e5};
  const E=CONFIG.emailjs;
  if(E.serviceId&&E.templateId&&E.publicKey){
    const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({service_id:E.serviceId,template_id:E.templateId,user_id:E.publicKey,template_params:{to_email:u.email,username:u.username,code}})});
    if(!r.ok)throw new Error("Couldn't send the email. Check your EmailJS settings.");
  }else{const m=$("#mail");m.innerHTML=`<small>DEMO INBOX · to ${esc(u.email)}</small>Your ${esc(CONFIG.storeName)} confirmation code<b>${code}</b><small>Demo mode: no real email was sent.</small>`;
    m.classList.add("on");setTimeout(()=>m.classList.remove("on"),20000)}
}

/* ---------- 1) human check ---------- */
const GT=1800;
function gate(){
  if(sessionStorage.getItem("cle_human")){$("#gate").classList.add("hide");return afterGate()}
  const g=$("#gate"),ring=$("#ring"),T=$("#ticks"),N=72;
  T.innerHTML=Array.from({length:N},(_,i)=>`<line x1="100" y1="8" x2="100" y2="${i%6?19:27}" transform="rotate(${i*360/N} 100 100)"/>`).join("");
  const L=[...T.children],items=[...document.querySelectorAll("#chk li")];
  const msgs=["Checking your browser…","Measuring timing…","Reading pointer…","Confirming you're human…"];
  let hold=0,holding=false,done=false,raf=0,lastK=-1,boom=false,alive=true,ft=0;
  const idle=()=>{$("#gp").textContent="Press and hold the button until the ring fills."};
  const paint=p=>{
    const n=Math.round(p*N);L.forEach((l,i)=>{l.classList.toggle("on",i<n);l.classList.toggle("hd",i===n-1&&p<1)});
    $("#pct").textContent=p>0?Math.floor(p*100):"";$("#cl").textContent=p>0?"percent":"Hold";
    items.forEach((li,i)=>li.classList.toggle("on",p>0&&p>=(i+1)/4-.001));
    const k=Math.min(3,Math.floor(p*4));
    if(p>0&&p<1){$("#gp").textContent=msgs[k];if(k!==lastK){lastK=k;navigator.vibrate&&navigator.vibrate(14)}}
    if(p===0)lastK=-1;
    ring.style.setProperty("--g",p);
    ring.style.setProperty("--sx",(Math.random()-.5)*p*p*5+"px");ring.style.setProperty("--sy",(Math.random()-.5)*p*p*5+"px");
  };
  const frame=t=>{
    if(done)return;const dt=ft?Math.min(50,t-ft):16;ft=t;
    hold=holding?Math.min(1,hold+dt/GT):Math.max(0,hold-dt/450);paint(hold);
    if(hold>=1)return win();
    if(holding||hold>0)raf=requestAnimationFrame(frame);else{ft=0;idle()}
  };
  const kick=()=>{cancelAnimationFrame(raf);ft=0;raf=requestAnimationFrame(frame)};
  const start=e=>{if(done||holding)return;e.preventDefault&&e.preventDefault();holding=true;ring.classList.add("hold");kick()};
  const stop=()=>{if(!holding)return;holding=false;ring.classList.remove("hold")};
  ring.addEventListener("pointerdown",start);addEventListener("pointerup",stop);addEventListener("pointercancel",stop);
  ring.addEventListener("contextmenu",e=>e.preventDefault());
  ring.tabIndex=0;ring.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")start(e)});ring.addEventListener("keyup",stop);
  async function win(){
    done=true;paint(1);ring.style.setProperty("--sx","0px");ring.style.setProperty("--sy","0px");ring.classList.remove("hold");ring.classList.add("ok");
    $("#pct").innerHTML='<svg class="ck" viewBox="0 0 60 60"><path d="M15 31l11 11 20-22"/></svg>';$("#cl").textContent="";
    $("#gh").textContent="You're in";$("#gp").textContent="Access granted.";boom=true;
    navigator.vibrate&&navigator.vibrate([30,40,70]);
    [0,.15,.3].forEach(d=>{const w=document.createElement("div");w.className="wave";w.style.setProperty("--d",d+"s");ring.appendChild(w)});
    await sleep(1100);sessionStorage.setItem("cle_human","1");afterGate();g.classList.add("iris");await sleep(1150);alive=false;g.classList.add("hide");
  }
  /* particles: drift in orbit, get pulled into the ring while you hold, explode on success */
  const c=$("#gc"),x=c.getContext("2d");
  const rs=()=>{const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)};rs();addEventListener("resize",rs);
  const P=Array.from({length:reduce?0:110},()=>{const h=130+Math.random()*Math.max(innerWidth,innerHeight)*.55;return{a:Math.random()*6.283,home:h,r:h,s:(Math.random()*.5+.15)*(Math.random()<.5?-1:1),z:Math.random()*1.6+.5}});
  (function draw(){
    if(!alive)return;
    x.fillStyle="rgba(0,0,0,.2)";x.fillRect(0,0,innerWidth,innerHeight);
    const b=ring.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
    for(const p of P){
      p.a+=p.s*.004*(1+hold*7);
      if(boom)p.r+=14*p.z;else p.r+=((p.home*(1-hold)+(108+p.z*5)*hold)-p.r)*.07;
      const px=cx+Math.cos(p.a)*p.r,py=cy+Math.sin(p.a)*p.r;
      x.fillStyle=boom?"rgba(154,162,255,.9)":`rgba(255,255,255,${.22+hold*.7})`;
      x.beginPath();x.arc(px,py,p.z*(1+hold*.8),0,7);x.fill();
    }
    requestAnimationFrame(draw);
  })();
}
function afterGate(){me()?enterSite():showAuth("signup")}

/* ---------- 2) sign up / log in / confirm email ---------- */
const fld=(id,label,type="text",extra="")=>`<div class="fld"><input id="${id}" type="${type}" placeholder=" " autocomplete="off" ${extra}><label for="${id}">${label}</label>${type==="password"?`<button type="button" class="eye" data-e="${id}">SHOW</button>`:""}</div>`;
function showAuth(mode){
  $("#auth").classList.remove("hide","out");const box=$("#authbox");
  box.innerHTML=`<div class="brand">${esc(CONFIG.storeName)}</div>
   <div class="tabs ${mode==="login"?"r":""}"><button data-m="signup" class="${mode==="signup"?"on":""}">Create account</button><button data-m="login" class="${mode==="login"?"on":""}">Log in</button><u></u></div>
   <div class="step">${mode==="signup"?
    `${fld("em","Email","email")}${fld("un","Username")}<div class="hint">3–16 characters: letters, numbers, _ or .</div>${fld("pw","Password","password")}<div class="str"><i id="sb"></i></div>${fld("pw2","Confirm password","password")}${disc()}`:
    `${fld("id","Email or username")}${fld("pw","Password","password")}`}
    <div class="err" id="er"></div><button class="go" id="go">${mode==="signup"?"Create account":"Log in"}</button></div>`;
  box.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
  box.querySelectorAll(".eye").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.e);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"SHOW":"HIDE"});
  const pw=$("#pw");
  if(mode==="signup")pw.oninput=()=>{const v=pw.value;let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v)||v.length>=14)s++;
    const b=$("#sb");b.style.width=s*25+"%";b.style.background=["#ff5d6c","#ff5d6c","#ffb020","#9ae35a","#4ade80"][s]};
  const fail=m=>{const e=$("#er");e.textContent=m;e.classList.remove("sh");void e.offsetWidth;e.classList.add("sh")};
  const busy=b=>{$("#go").disabled=b;$("#go").classList.toggle("ld",b)};
  const go=async()=>{
    busy(true);try{
      const U=users();
      if(mode==="signup"){
        const em=$("#em").value.trim().toLowerCase(),un=$("#un").value.trim(),p=pw.value;
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return fail("Enter a valid email address.");
        if(!/^[A-Za-z0-9_.]{3,16}$/.test(un))return fail("Username must be 3–16 characters: letters, numbers, _ or .");
        if(p.length<8)return fail("Password must be at least 8 characters.");
        if(p!==$("#pw2").value)return fail("Passwords don't match.");
        if(locked(un,em))return fail("That username is reserved.");
        const old=U.find(x=>x.email===em||x.username.toLowerCase()===un.toLowerCase());
        if(old&&old.verified)return fail(old.email===em?"That email already has an account. Log in instead.":"That username is taken.");
        const salt=rnd(),user={email:em,username:un,salt,hash:await hashPw(p,salt),verified:false,created:Date.now(),orders:[]};
        saveUsers(U.filter(x=>x!==old).concat(user));await sendCode(user);showVerify(user);
      }else{
        const id=$("#id").value.trim().toLowerCase(),u=U.find(x=>x.email===id||x.username.toLowerCase()===id);
        if(!u||await hashPw(pw.value,u.salt)!==u.hash)return fail("Wrong email/username or password.");
        if(!u.verified){await sendCode(u);return showVerify(u)}
        const bm=blockedMsg(u);if(bm)return fail(bm);
        localStorage.setItem("cle_session",u.username);enterSite(true);
      }
    }catch(e){fail(e.message||"Something went wrong. Try again.")}finally{busy(false)}};
  $("#go").onclick=go;box.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});
}
function showVerify(u){
  const box=$("#authbox");let left=30,timer;
  box.innerHTML=`<div class="brand">${esc(CONFIG.storeName)}</div><div class="step"><h1 class="s" style="margin-bottom:12px">Confirm your email</h1>
   <p class="d">We sent a 6-digit code to <b>${esc(u.email)}</b>. It expires in 10 minutes.</p>
   <div class="otp" id="otp">${"<input inputmode=numeric maxlength=1 autocomplete=off>".repeat(6)}</div>
   <div class="err" id="er"></div><button class="go" id="go">Confirm email</button>
   <button class="lk" id="rs" disabled>Resend code in 30s</button> <button class="lk" id="bk">Back</button></div>`;
  const ins=[...box.querySelectorAll("#otp input")],otp=$("#otp");ins[0].focus();
  const val=()=>ins.map(i=>i.value).join("");
  ins.forEach((i,k)=>{i.oninput=()=>{i.value=i.value.replace(/\D/g,"").slice(-1);i.classList.toggle("f",!!i.value);if(i.value&&ins[k+1])ins[k+1].focus();if(val().length===6)chk()};
    i.onkeydown=e=>{if(e.key==="Backspace"&&!i.value&&ins[k-1])ins[k-1].focus();if(e.key==="Enter")chk()};
    i.onpaste=e=>{const d=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);if(!d)return;e.preventDefault();[...d].forEach((c,j)=>{ins[j].value=c;ins[j].classList.add("f")});ins[Math.min(5,d.length)-0>5?5:d.length]?.focus();if(d.length===6)chk()}});
  const tick=()=>{left--;const r=$("#rs");if(!r)return clearInterval(timer);if(left<=0){clearInterval(timer);r.disabled=false;r.textContent="Resend code"}else r.textContent=`Resend code in ${left}s`};
  timer=setInterval(tick,1000);
  $("#rs").onclick=async()=>{try{await sendCode(u);left=30;$("#rs").disabled=true;timer=setInterval(tick,1000);toast("New code sent")}catch(e){$("#er").textContent=e.message}};
  $("#bk").onclick=()=>{clearInterval(timer);showAuth("login")};
  async function chk(){
    const bad=m=>{$("#er").textContent=m;otp.classList.remove("bad");void otp.offsetWidth;otp.classList.add("bad");setTimeout(()=>{otp.classList.remove("bad");ins.forEach(i=>{i.value="";i.classList.remove("f")});ins[0].focus()},600)};
    if(!pending||pending.username!==u.username||Date.now()>pending.exp)return bad("That code expired. Request a new one.");
    if(val()!==pending.code)return bad("Wrong code. Check the email and try again.");
    clearInterval(timer);otp.classList.add("good");const U=users(),x=U.find(y=>y.username===u.username);x.verified=true;saveUsers(U);pending=null;notifyWebhook(x);
    localStorage.setItem("cle_session",u.username);$("#mail").classList.remove("on");await sleep(700);enterSite(true)}
  $("#go").onclick=chk;
}

/* ---------- 3) the store ---------- */
const st={v:"home"};
async function enterSite(fresh){
  const u=me(),bm=u&&blockedMsg(u);
  if(bm){localStorage.removeItem("cle_session");$("#site").classList.add("hide");showAuth("login");setTimeout(()=>{const e=$("#er");if(e)e.textContent=bm},60);return}
  $("#auth").classList.add("out");$("#site").classList.remove("hide");header();render();
  if(fresh)toast("Welcome, "+me().username);
  setTimeout(()=>$("#auth").classList.add("hide"),900)}
function header(){
  const u=me();$("#brand").textContent=CONFIG.storeName;$("#brand").onclick=()=>go("home");$("#foot").textContent="© "+new Date().getFullYear()+" "+CONFIG.storeName;

function home(a){

    const k=(c.products||[]).filter(p=>!p.sold).length,state=c.soon?"Coming soon":k?`<span data-c="${k}">0</span> available`:"Not in stock";
    return`<div class="c ${c.soon?"off":""}" data-id="${c.id}" style="--n:${n++}"><div><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p></div><div class="f"><span>${state}</span>${c.soon?"":'<span class="ar">→</span>'}</div></div>`}).join("")+`</div>`).join("")+`</section>`;
  a.querySelectorAll("[data-c]").forEach(e=>setTimeout(()=>countUp(e,+e.dataset.c,v=>Math.round(v)),900));

const locked=(un,em)=>{const k=Object.keys(CONFIG.lockedUsernames).find(k=>k.toLowerCase()===un.toLowerCase());return !!k&&!!CONFIG.lockedUsernames[k]&&CONFIG.lockedUsernames[k].toLowerCase()!==em};
async function notifyWebhook(u){
  const w=CONFIG.webhook;if(!w.url)return;
  const f=[{name:"Username",value:u.username,inline:true}];if(w.includeEmail)f.push({name:"Email",value:u.email,inline:true});
  f.push({name:"Total accounts",value:String(users().filter(x=>x.verified).length)});
  try{await fetch(w.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:CONFIG.storeName,embeds:[{title:"New account created",color:8090111,fields:f,timestamp:new Date().toISOString()}]})})}catch(e){}
}
function badgesOf(u){
  const set=new Set(),cfg=Object.entries(CONFIG.badgeUsers).find(([k])=>k.toLowerCase()===u.username.toLowerCase());
  const lk=Object.entries(CONFIG.lockedUsernames).find(([k])=>k.toLowerCase()===u.username.toLowerCase()),ok=!lk||!lk[1]||lk[1].toLowerCase()===String(u.email).toLowerCase();
  (cfg&&ok?cfg[1]:[]).forEach(b=>{const k=Object.keys(BADGE_DEFS).find(x=>x.toLowerCase()===String(b).toLowerCase());if(k)set.add(k)});
  if(CONFIG.autoBuyerBadge&&(u.orders||[]).length)set.add("Buyer");
  (adm().badges[low(u.username)]||[]).forEach(b=>BADGE_DEFS[b]&&set.add(b));
  if(isAdmin(u))set.add("Admin");
  return Object.keys(BADGE_DEFS).filter(k=>set.has(k));
}

  const mine=m&&m.username===U.username,o=[...(U.orders||[])].reverse(),spent=o.reduce((t,x)=>t+x.total,0),priv=U.showOrders===false,see=mine||!priv,bs=badgesOf(U);

    ${mine?`<button class="gb ed" id="edit">Edit profile</button>`:""}</div>

   ${see?(o.length?o.map((x,i)=>`<div class="ord" style="--n:${i}"><span>${esc(x.name)}<br><small style="color:var(--m)">${new Date(x.date).toLocaleString()} · ${esc(x.method)}</small></span><b>${money(x.total)}</b></div>`).join(""):`<p class="empty">No purchases yet.</p>`):`<p class="empty">${esc(U.username)} keeps their purchases private.</p>`}</section>`;
  $("#pbk").onclick=()=>go("home");
  if(!mine)return;
  $("#po").onchange=e=>{const all=users(),x=all.find(y=>y.username===U.username);x.showOrders=e.target.checked;saveUsers(all);
    $("#pl").textContent=e.target.checked?"Public · everyone can see this":"Private · only you can see this";toast(e.target.checked?"Purchases are now public":"Purchases are now private")};

function editProfile(U){
  const md=$("#md"),close=()=>$("#ov").classList.remove("open"),hasBadges=Object.keys(CONFIG.badgeUsers).some(k=>k.toLowerCase()===U.username.toLowerCase());
  md.innerHTML=`<button class="x" id="x" aria-label="Close">×</button><h3>Edit profile</h3><p class="nt">Change your username.${hasBadges?` Your badges are assigned to <b>${esc(U.username)}</b>, so you'll lose them if you rename.`:""}</p>
   ${fld("nn","New username")}${fld("npw","Current password","password")}<div class="err" id="ner"></div><button class="go" id="ngo">Save username</button>`;
  $("#ov").onmousedown=e=>{if(e.target.id==="ov")close()};$("#ov").classList.add("open");$("#x").onclick=close;setTimeout(()=>$("#nn").focus(),60);
  md.querySelectorAll(".eye").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.e);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"SHOW":"HIDE"});
  const er=t=>{const e=$("#ner");e.textContent=t;e.classList.remove("sh");void e.offsetWidth;e.classList.add("sh")};
  const save=async()=>{
    const nn=$("#nn").value.trim(),all=users(),x=all.find(y=>y.username===U.username);
    if(!/^[A-Za-z0-9_.]{3,16}$/.test(nn))return er("Username must be 3–16 characters: letters, numbers, _ or .");
    if(nn===U.username)return er("That's already your username.");
    if(all.some(y=>y!==x&&y.username.toLowerCase()===nn.toLowerCase()))return er("That username is taken.");
    if(locked(nn,x.email))return er("That username is reserved.");
    $("#ngo").classList.add("ld");
    if(await hashPw($("#npw").value,x.salt)!==x.hash){$("#ngo").classList.remove("ld");return er("Wrong password.")}
    x.username=nn;saveUsers(all);localStorage.setItem("cle_session",nn);close();header();toast("Username changed to "+nn);st.v="account";render();
  };
  $("#ngo").onclick=save;md.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")save()});
}

function sres(){

async function getRate(){if(rate)return;try{rate=(await(await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=gbp")).json()).bitcoin.gbp}catch(e){}}
function checkout(p){
  let pct=0,code="",m="btc",first=true;const md=$("#md"),tot=()=>p.price*(1-pct/100);
  const img=(CONFIG.images.folder+p.image).replace(/(\.\w+)?$/,x=>x||CONFIG.images.extension);
  const draw=()=>{const t=tot();
    md.innerHTML=`<button class="x" id="x" aria-label="Close">×</button><h3>${esc(p.full)}</h3>${p.features?`<div class="ft">${p.features.map(f=>`<span>✓ ${esc(f)}</span>`).join("")}</div>`:""}<img src="${esc(img)}" alt="" onerror="this.remove()">
    <div class="sum"><div><span>Price</span><span>${money(p.price)}</span></div>${pct?`<div class="o"><span>Code ${esc(code)} (−${pct}%)</span><span>−${money(p.price-t)}</span></div>`:""}<div class="t"><span style="color:#fff">Total</span><span id="tt">${money(t)}</span></div></div>
    <div class="cr"><div class="fld"><input id="cd" type="text" placeholder=" " value="${esc(code)}" autocomplete="off"><label for="cd">Discount code</label></div><button class="gb" id="ap">Apply</button></div><div class="msg" id="ms"></div>
    <div class="pay ${m==="robux"?"r":""}"><u></u><button data-m="btc" class="${m==="btc"?"on":""}">Bitcoin</button><button data-m="robux" class="${m==="robux"?"on":""}">Robux</button></div>
    ${m==="btc"?`<div class="addr" id="ad">${esc(CONFIG.btcAddress)}</div>${rate?`<p class="nt">≈ ${(t/rate).toFixed(6)} BTC at the current rate. Send the GBP equivalent at the time you pay.</p>`:""}
      <div class="stk"><button class="gb" id="cp">Copy address</button><button class="go" id="pd">I've paid</button></div>`:
      `<p class="nt">You'll be taken to Roblox to complete the purchase.</p><div class="stk"><a class="go" style="text-align:center;text-decoration:none" href="${esc(p.robuxLink||CONFIG.robuxLink)}" target="_blank" rel="noopener">Pay with Robux</a><button class="gb" id="pd">I've paid</button></div>`}`;
    if(first){countUp($("#tt"),t,money);first=false}
    $("#x").onclick=close;md.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{m=b.dataset.m;draw()});
    const ap=()=>{const v=$("#cd").value.trim().toUpperCase(),h=Object.keys(CONFIG.discountCodes).find(k=>k.toUpperCase()===v);
      if(!v){pct=0;code="";return draw()}
      if(h){pct=CONFIG.discountCodes[h];code=h;draw();$("#ms").className="msg ok";$("#ms").textContent="Code applied: "+pct+"% off."}
      else{pct=0;code="";draw();$("#cd").value=v;$("#ms").className="msg er";$("#ms").textContent="That code isn't valid."}};
    $("#ap").onclick=ap;$("#cd").onkeydown=e=>{if(e.key==="Enter")ap()};
    const cp=$("#cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(CONFIG.btcAddress);cp.textContent="Copied ✓";toast("Address copied")}catch(e){cp.textContent="Select and copy the address"}};
    $("#pd").onclick=()=>{const U=users(),u=U.find(x=>x.username===localStorage.getItem("cle_session"));u.orders.push({name:p.full,total:tot(),method:m==="btc"?"Bitcoin":"Robux",date:Date.now()});saveUsers(U);done()};
  };
  const done=()=>{md.innerHTML=`<div class="dn"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26.5"/><path d="M18 31l8 8 16-17"/></svg><h3 style="margin:0">Thanks for your order</h3><p>${esc(CONFIG.afterPurchaseMessage)}</p>
    ${CONFIG.discordInvite?`<a class="go" style="display:block;text-decoration:none;margin-bottom:10px" href="${esc(CONFIG.discordInvite)}" target="_blank" rel="noopener">Open our Discord</a>`:""}<button class="gb" style="width:100%" id="c2">Close</button></div>`;$("#c2").onclick=close};
  const close=()=>$("#ov").classList.remove("open");
  $("#ov").onmousedown=e=>{if(e.target.id==="ov")close()};
  $("#ov").classList.add("open");draw();getRate().then(()=>{if($("#ov").classList.contains("open")&&m==="btc"&&rate&&$("#ad")){const f=first;draw()}});
}

const low=s=>String(s).toLowerCase(),AK="cle_admin";
const adm0=()=>({badges:{},banned:{},blacklist:[],admins:[],defs:{},announce:"",noSignup:false});
function adm(){try{return Object.assign(adm0(),JSON.parse(localStorage.getItem(AK)||"{}"))}catch(e){return adm0()}}
const admSave=d=>localStorage.setItem(AK,JSON.stringify(d));
function isAdmin(u){return !!u&&[...CONFIG.admins,...adm().admins].some(a=>low(a)===low(u.email))}
Object.assign(BADGE_DEFS,adm().defs);
function blockedMsg(u){
  if(isAdmin(u))return"";const d=adm(),b=d.banned[low(u.username)]||d.banned[low(u.email)];
  if(b)return"You are banned."+(b.reason?" Reason: "+b.reason:"");
  if(d.blacklist.includes(low(u.username))||d.blacklist.includes(low(u.email)))return"This account is blacklisted.";
  if(d.noSignup&&!users().some(x=>x.verified&&x.username===u.username))return"Sign-ups are currently closed.";
  return"";
}

 tools:d=>`<h4>Site announcement banner</h4><input class="ai" id="an" placeholder="Leave empty for none" value="${esc(d.announce)}"><button class="gb" data-a="ann">Save banner</button>
  <label class="sw"><input type="checkbox" id="ns" ${d.noSignup?"checked":""}><i></i><span>Close new sign-ups</span></label>
  <h4>Data</h4><div class="ab2 row"><button class="gb" data-a="exp">Export JSON</button><button class="gb" data-a="imp">Import JSON</button><button class="gb" data-a="purge">Purge unverified</button></div><input type="file" id="af" accept=".json" class="hide">
  <p class="nt">${users().length} accounts · ${users().filter(u=>u.verified).length} verified · ${users().reduce((t,u)=>t+(u.orders||[]).length,0)} orders</p>`
};
function admDraw(){const d=adm(),m=$("#am");
  m.innerHTML=`<button class="x" id="ax">×</button><h3>Admin panel</h3><div class="atabs">${Object.keys(AT).map(t=>`<button class="gb ${t===atab?"on":""}" data-t="${t}">${t}</button>`).join("")}</div>${AT[atab](d)}`;
  $("#ax").onclick=()=>$("#aov").classList.remove("open");
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{atab=b.dataset.t;admDraw()});
  const q=$("#aq");if(q)q.oninput=()=>{aq=low(q.value.trim());$("#ul").innerHTML=ulist()};
  const ns=$("#ns");if(ns)ns.onchange=()=>{const d=adm();d.noSignup=ns.checked;admSave(d);toast(ns.checked?"Sign-ups closed":"Sign-ups open")};
  const af=$("#af");if(af)af.onchange=()=>{const f=af.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.users)saveUsers(j.users);if(j.admin)admSave(j.admin);toast("Imported");location.reload()}catch(e){toast("Invalid file")}};r.readAsText(f)};
}
$("#am").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,k=b.dataset.k,d=adm(),v=id=>($("#"+id)?.value||"").trim();
  const U=n=>users().find(u=>low(u.username)===low(n));
  const done=m=>{admSave(d);if(m)toast(m);admDraw();header()};
  if(a==="ren"){const n=(prompt("New username for "+k+":")||"").trim();if(!n)return;
    if(!/^[A-Za-z0-9_.]{3,16}$/.test(n))return toast("3–16 chars: letters, numbers, _ or .");
    const all=users();if(all.some(x=>x.username!==k&&low(x.username)===low(n)))return toast("Username taken");
    all.find(x=>x.username===k).username=n;saveUsers(all);
    if(d.badges[low(k)]){d.badges[low(n)]=d.badges[low(k)];delete d.badges[low(k)]}
    if(localStorage.getItem("cle_session")===k)localStorage.setItem("cle_session",n);return done("Renamed to "+n)}
  if(a==="ban"){if(isAdmin(U(k)))return toast("Can't ban an admin");const r=prompt("Reason (optional):");if(r===null)return;d.banned[low(k)]={reason:r,date:Date.now()};return done(k+" banned")}
  if(a==="unban"||a==="unb"){delete d.banned[low(k)];const u=U(k);if(u)delete d.banned[low(u.email)];return done("Unbanned")}
  if(a==="clr"){if(!confirm("Wipe all orders for "+k+"?"))return;const all=users();all.find(x=>x.username===k).orders=[];saveUsers(all);return done("Orders wiped")}
  if(a==="del"){if(!confirm("Delete account "+k+" permanently?"))return;saveUsers(users().filter(x=>x.username!==k));return done("Deleted")}
  if(a==="bgadd"||a==="bgrm"){const n=low(v("bu")),bd=$("#bs").value;if(!n)return toast("Type a username");
    const s=new Set(d.badges[n]||[]);a==="bgadd"?s.add(bd):s.delete(bd);d.badges[n]=[...s];return done(a==="bgadd"?"Badge added":"Badge removed")}
  if(a==="bgx"){d.badges[k]=(d.badges[k]||[]).filter(x=>x!==b.dataset.b);return done("Removed")}
  if(a==="nb"){const n=v("nbn").replace(/\s/g,"");if(!n||!v("nbg"))return toast("Name and symbol needed");
    d.defs[n]={g:v("nbg"),c:$("#nbc").value,d:n};BADGE_DEFS[n]=d.defs[n];return done("Badge created")}
  if(a==="banT"||a==="blT"){const t=low(v("bt"));if(!t)return toast("Enter a username or email");
    if(CONFIG.admins.some(x=>low(x)===t))return toast("Can't target an admin");
    if(a==="banT")d.banned[t]={reason:v("br"),date:Date.now()};else if(!d.blacklist.includes(t))d.blacklist.push(t);return done("Done")}
  if(a==="unbl"){d.blacklist=d.blacklist.filter(x=>x!==k);return done("Removed")}
  if(a==="admadd"){const m=low(v("ae"));if(!/^\S+@\S+\.\S+$/.test(m))return toast("Invalid email");if(!d.admins.includes(m))d.admins.push(m);return done("Admin added")}
  if(a==="admx"){d.admins=d.admins.filter(x=>x!==k);return done("Removed")}
  if(a==="ann"){d.announce=v("an");return done("Banner saved")}
  if(a==="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({users:users(),admin:adm()},null,1)],{type:"application/json"}));l.download="cle-backup.json";l.click();return}
  if(a==="imp")return $("#af").click();
  if(a==="purge"){if(!confirm("Delete all unverified accounts?"))return;saveUsers(users().filter(x=>x.verified));return done("Purged")}
});

gate();
</script>
</body>
</html>
