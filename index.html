    const pd=$("#pd");if(pd)pd.onclick=()=>{const U=users(),u=U.find(x=>x.username===localStorage.getItem("cle_session"));u.orders.push({name:p.full,total:tot(),method:m==="btc"?"Bitcoin":m==="robux"?"Robux":"Card",date:Date.now()});saveUsers(U);done()};
  };

const CL=()=>!!(CONFIG.cloud&&CONFIG.cloud.url&&CONFIG.cloud.key);
async function cReq(path,opt={}){
  const r=await fetch(CONFIG.cloud.url.replace(/\/$/,"")+"/rest/v1/"+path,{...opt,headers:{apikey:CONFIG.cloud.key,Authorization:"Bearer "+CONFIG.cloud.key,"Content-Type":"application/json",...(opt.headers||{})}});
  if(!r.ok)throw new Error("Cloud error "+r.status);const t=await r.text();return t?JSON.parse(t):null}
let DIR=[];
async function loadDir(){if(!CL())return;try{DIR=(await cReq("profiles?select=username,created&order=created.desc&limit=1000"))||[]}catch(e){}}
async function pushProfile(u){if(!CL()||!u||!u.verified)return;try{await cReq("profiles?on_conflict=username_lc",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({username_lc:u.username.toLowerCase(),username:u.username,created:u.created})})}catch(e){}}
async function cDel(n){if(!CL())return;try{await cReq("profiles?username_lc=eq."+encodeURIComponent(String(n).toLowerCase()),{method:"DELETE"})}catch(e){}}
async function pullSettings(){
  if(!CL())return;
  try{const r=await cReq("site?id=eq.settings&select=data");
    if(r&&r[0]&&r[0].data){localStorage.setItem(AK,JSON.stringify(r[0].data));Object.assign(BADGE_DEFS,adm().defs);applyProd(adm())}
    else if(localStorage.getItem(AK))pushSettings(adm())}catch(e){}}

  ${CL()?`<div class="ab"><button class="gb" data-a="csync">Upload this device's accounts</button><button class="gb" data-a="cpull">Refresh from cloud</button></div>`:""}
  <details><summary>How to set it up (5 minutes, free)</summary><ol class="nt"><li>Create a free project at supabase.com.</li><li>Open <b>SQL Editor</b>, paste the code below and run it.</li><li>Open <b>Project Settings → API</b>. Copy the Project URL and the <b>anon public</b> key.</li><li>Paste them into <code>cloud:{url:"",key:""}</code> at the top of the script and re-upload the site.</li></ol>
  <pre class="addr">${esc(SQL)}</pre><button class="gb" data-a="copysql">Copy SQL</button>
  <p class="nt">Heads up: the anon key is visible in the page source and these policies are open, so a technical visitor could edit the directory or settings. It's fine for a small store, but not secure against someone determined.</p></details>
  <h4>Data</h4><div class="ab"><button class="gb" data-a="exp">Export JSON</button><button class="gb" data-a="imp">Import JSON</button><button class="gb" data-a="purge">Purge unverified</button><button class="gb dg" data-a="reset">Reset admin settings</button></div><input type="file" id="af" accept=".json" class="hide">
  <p class="nt">${users().length} local accounts · ${users().filter(u=>u.verified).length} verified · ${allOrders().length} orders</p>`,
 log:d=>`<h3>Activity</h3><p class="lead">Recent admin actions.</p>${(d.log||[]).map(x=>`<div class="ar2"><span>${esc(x.m)}<br><small>${esc(x.by)} · ${ago(x.t)}</small></span></div>`).join("")||'<p class="nt">Nothing yet.</p>'}${(d.log||[]).length?'<button class="gb dg" data-a="clog">Clear log</button>':""}`
};
function admDraw(){
  const d=adm(),m=$("#am"),keep=m.querySelector(".ac")?.scrollTop||0;
  m.innerHTML=`<button class="x" id="ax" aria-label="Close">×</button><div class="adm"><nav class="as"><div class="at">Admin</div>${TABS.map(([t,n,g])=>`<button data-t="${t}" class="${t===atab?"on":""}"><i>${g}</i>${n}</button>`).join("")}</nav><div class="ac">${AT[atab](d)}</div></div>`;
  m.querySelector(".ac").scrollTop=keep;
  $("#ax").onclick=()=>$("#aov").classList.remove("open");
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{atab=b.dataset.t;admDraw();m.querySelector(".ac").scrollTop=0});
  const q=$("#aq");if(q)q.oninput=()=>{aq=q.value.trim();$("#ul").innerHTML=ulist()};
  const o=$("#oq");if(o)o.oninput=()=>{aoq=o.value.trim();$("#ol").innerHTML=olist()};
  const ns=$("#ns");if(ns)ns.onchange=()=>{const d=adm();d.noSignup=ns.checked;logA(d,ns.checked?"Closed sign-ups":"Opened sign-ups");admSave(d);toast(ns.checked?"Sign-ups closed":"Sign-ups open")};
  const af=$("#af");if(af)af.onchange=()=>{const f=af.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.users)saveUsers(j.users);if(j.admin)admSave(j.admin);toast("Imported");location.reload()}catch(e){toast("Invalid file")}};r.readAsText(f)};
}
$("#am").addEventListener("change",e=>{
  const i=e.target.closest("[data-pp]");if(!i)return;const d=adm(),key=i.dataset.pp,p=findProd(key);if(!p)return;
  const val=Math.max(0,+i.value||0),o=(d.prod[key]=d.prod[key]||{});
  if(val===p.price0)delete o.price;else o.price=val;if(!Object.keys(o).length)delete d.prod[key];
  logA(d,"Price of "+p.full+" set to "+money(val));admSave(d);applyProd(d);render();toast("Price saved");admDraw()});
$("#am").addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){afl=f.dataset.f;return admDraw()}
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,k=b.dataset.k,d=adm(),v=id=>($("#"+id)?.value||"").trim();
  const U=n=>allUsers().find(u=>low(u.username)===low(n)),Lc=n=>users().find(u=>low(u.username)===low(n));
  const self=n=>me()&&low(me().username)===low(n);
  const done=m=>{if(m){logA(d,m);toast(m)}admSave(d);admDraw();header()};
  if(a==="ex"){aex=aex===low(k)?"":low(k);return $("#ul").innerHTML=ulist()}
  if(a==="goto"){atab="users";aq=k;afl="all";aex=low(k);return admDraw()}
  if(a==="view"){$("#aov").classList.remove("open");return openUser(k)}
  if(a==="ren"){const n=(prompt("New username for "+k+":")||"").trim();if(!n)return;
    if(!/^[A-Za-z0-9_.]{3,16}$/.test(n))return toast("3–16 chars: letters, numbers, _ or .");
    const all=users();if(all.some(x=>x.username!==k&&low(x.username)===low(n)))return toast("Username taken");
    const x=all.find(x=>x.username===k);x.username=n;saveUsers(all);cDel(k);pushProfile(x);
    if(d.badges[low(k)]){d.badges[low(n)]=d.badges[low(k)];delete d.badges[low(k)]}
    if(localStorage.getItem("cle_session")===k)localStorage.setItem("cle_session",n);aex=low(n);return done("Renamed "+k+" to "+n)}
  if(a==="ban"){if(self(k))return toast("You can't ban yourself");if(isAdmin(U(k)))return toast("Can't ban an admin");const r=prompt("Reason (optional):");if(r===null)return;d.banned[low(k)]={reason:r,date:Date.now()};return done("Banned "+k)}
  if(a==="unban"||a==="unb"){delete d.banned[low(k)];const u=U(k);if(u&&u.email)delete d.banned[low(u.email)];return done("Unbanned "+k)}
  if(a==="ver"||a==="unver"){const all=users(),x=all.find(y=>y.username===k);x.verified=a==="ver";saveUsers(all);if(x.verified)pushProfile(x);return done((x.verified?"Verified ":"Unverified ")+k)}
  if(a==="adm"){const u=Lc(k),em=low(u.email);if(CONFIG.admins.some(x=>low(x)===em))return toast("Permanent admin (set in CONFIG)");
    d.admins=d.admins.includes(em)?d.admins.filter(x=>x!==em):d.admins.concat(em);return done((d.admins.includes(em)?"Made ":"Removed admin from ")+k+(d.admins.includes(em)?" an admin":""))}
  if(a==="ubadd"){const s=new Set(d.badges[low(k)]||[]);s.add($("#ub").value);d.badges[low(k)]=[...s];return done("Gave "+$("#ub").value+" badge to "+k)}
  if(a==="clr"){if(!confirm("Wipe all orders for "+k+"?"))return;const all=users();all.find(x=>x.username===k).orders=[];saveUsers(all);return done("Wiped orders for "+k)}
  if(a==="del"){if(self(k))return toast("You can't delete yourself");if(!confirm("Delete "+k+" permanently?"))return;saveUsers(users().filter(x=>x.username!==k));cDel(k);DIR=DIR.filter(x=>low(x.username)!==low(k));aex="";return done("Deleted "+k)}
  if(a==="odel"){if(!confirm("Remove this order?"))return;const all=users(),x=all.find(y=>y.username===k);x.orders=(x.orders||[]).filter(o=>String(o.date)!==b.dataset.i);saveUsers(all);return done("Removed an order from "+k)}
  if(a==="psold"){const p=findProd(k),o=(d.prod[k]=d.prod[k]||{}),ns=!p.sold;if(ns===p.sold0)delete o.sold;else o.sold=ns;if(!Object.keys(o).length)delete d.prod[k];applyProd(d);render();return done(p.full+(ns?" marked sold":" marked for sale"))}
  if(a==="bgadd"||a==="bgrm"){const n=low(v("bu")),bd=$("#bs").value;if(!n)return toast("Type a username");
    const s=new Set(d.badges[n]||[]);a==="bgadd"?s.add(bd):s.delete(bd);d.badges[n]=[...s];return done((a==="bgadd"?"Gave ":"Removed ")+bd+(a==="bgadd"?" badge to ":" badge from ")+n)}
  if(a==="bgx"){d.badges[k]=(d.badges[k]||[]).filter(x=>x!==b.dataset.b);return done("Removed "+b.dataset.b+" from "+k)}
  if(a==="nb"){const n=v("nbn").replace(/\s/g,"");if(!n||!v("nbg"))return toast("Name and symbol needed");
    d.defs[n]={g:v("nbg"),c:$("#nbc").value,d:n};BADGE_DEFS[n]=d.defs[n];return done("Created badge "+n)}
  if(a==="nbdel"){delete d.defs[k];delete BADGE_DEFS[k];Object.keys(d.badges).forEach(u=>d.badges[u]=d.badges[u].filter(x=>x!==k));return done("Deleted badge "+k)}
  if(a==="banT"||a==="blT"){const t=low(v("bt"));if(!t)return toast("Enter a username or email");
    if(CONFIG.admins.some(x=>low(x)===t))return toast("Can't target an admin");
    if(a==="banT")d.banned[t]={reason:v("br"),date:Date.now()};else if(!d.blacklist.includes(t))d.blacklist.push(t);return done((a==="banT"?"Banned ":"Blacklisted ")+t)}
  if(a==="unbl"){d.blacklist=d.blacklist.filter(x=>x!==k);return done("Removed "+k+" from blacklist")}
  if(a==="admadd"){const m=low(v("ae"));if(!/^\S+@\S+\.\S+$/.test(m))return toast("Invalid email");if(!d.admins.includes(m))d.admins.push(m);return done("Added admin "+m)}
  if(a==="admx"){d.admins=d.admins.filter(x=>x!==k);return done("Removed admin "+k)}
  if(a==="ann"){d.announce=v("an");return done("Banner saved")}
  if(a==="csync"){(async()=>{for(const u of users().filter(x=>x.verified))await pushProfile(u);await loadDir();done("Uploaded accounts to cloud")})();return}
  if(a==="cpull"){(async()=>{await pullSettings();await loadDir();admDraw();header();toast("Refreshed")})();return}
  if(a==="copysql"){navigator.clipboard.writeText(SQL).then(()=>toast("SQL copied"),()=>toast("Select and copy it manually"));return}
  if(a==="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({users:users(),admin:adm()},null,1)],{type:"application/json"}));l.download="backup.json";l.click();return}
  if(a==="imp")return $("#af").click();
  if(a==="purge"){if(!confirm("Delete all unverified accounts?"))return;saveUsers(users().filter(x=>x.verified));return done("Purged unverified accounts")}
  if(a==="reset"){if(!confirm("Reset bans, badges, banner and product changes?"))return;Object.assign(d,adm0());applyProd(d);render();return done("Reset admin settings")}
  if(a==="clog"){d.log=[];return done()}
});

applyProd();

gate();
</script>
